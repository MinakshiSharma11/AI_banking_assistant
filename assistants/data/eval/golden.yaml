- id: E08
  lang: en
  user: ho_analyst
  question: Which branches had more closures than openings in Q2?
  route: sql
  check: key_set
  tests: free SQL path + validator (correct answer is none)
  reference_sql: |
    WITH q AS (SELECT make_date(extract(year FROM current_date)::int, 4, 1) AS f,
                      make_date(extract(year FROM current_date)::int, 7, 1) AS t)
    SELECT b.branch_code, b.branch_name
    FROM core.branch_master b, q
    WHERE (SELECT count(*) FROM core.cust_account a
           WHERE a.branch_code = b.branch_code AND a.record_stat = 'C'
             AND a.closed_date >= q.f AND a.closed_date < q.t)
        > (SELECT count(*) FROM core.cust_account a
           WHERE a.branch_code = b.branch_code AND a.auth_stat = 'A'
             AND a.account_open_date >= q.f AND a.account_open_date < q.t)

