- id: E05
  lang: en
  user: ho_analyst
  question: Mobile vs web transaction value by month, last 12 months
  route: metric
  check: rows_subset
  tests: line chart, time grain
  expect_query: {metric: txn_value_kwd, dimensions: [channel],
                 filters: [{dimension: channel, op: in, values: [Mobile, Web]}],
                 time: {period: last_12_months}, grain: month}
  reference_sql: &mobile_web_by_month |
    SELECT date_trunc('month', t.txn_date)::date,
           CASE t.channel WHEN 'OBDX_MOB' THEN 'Mobile' ELSE 'Web' END,
           sum(t.lcy_amount)
    FROM core.transaction t
    WHERE t.status = 'P' AND t.channel IN ('OBDX_MOB', 'OBDX_WEB')
      AND t.txn_date >= date_trunc('month', current_date) - interval '11 months'
      AND t.txn_date < current_date + 1
    GROUP BY 1, 2

