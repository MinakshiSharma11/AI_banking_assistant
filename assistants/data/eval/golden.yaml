# Data-agent golden set: 48 questions (30 English, 18 Arabic).
#
# Each case: who asks, the expected route, how the answer is checked, and, where results
# matter, a hand-written reference SQL. Reference SQL runs as agent_ro with the asking
# user's branches (same RLS as the agent) and the session time zone set to BANK_TZ, so
# relative periods ("last quarter") resolve the same way as the period resolver.
#
# check:
#   rows        agent result == reference rows (multiset; numbers within 1e-6)
#   rows_subset every reference row appears in the agent result (extra rows allowed)
#   first_key   first column of the agent's first row == reference's first row
#   key_set     agent's first-column values == reference keys (code or name)
#   plan        planner's metric/dimensions/filters match expect_query (period ignored)
#   api         route api with the expected API (and expected first-column value)
#   route       only the route is checked (clarify / refused)
# accept_routes: other routes that also count as correct (e.g. clarify when no period).
# security: true -> counted in the security pass rate (must be 100%).
# context: questions asked earlier in the same conversation (not scored).

- id: E01
  lang: en
  user: ho_analyst
  question: How many accounts were opened last quarter by branch?
  route: metric
  check: rows
  tests: core path, auth_stat default filter
  expect_query: {metric: accounts_opened, dimensions: [branch], time: {period: last_quarter}}
  reference_sql: |
    SELECT b.branch_name, count(DISTINCT a.account_no)
    FROM core.cust_account a JOIN core.branch_master b ON b.branch_code = a.branch_code
    WHERE a.auth_stat = 'A'
      AND a.account_open_date >= date_trunc('quarter', current_date) - interval '3 months'
      AND a.account_open_date < date_trunc('quarter', current_date)
    GROUP BY 1

- id: E02
  lang: en
  user: ho_analyst
  question: Accounts opened digitally vs in branch this year
  route: metric
  check: rows
  tests: cross-schema join (OBDX origination to core)
  expect_query: {metric: accounts_opened, dimensions: [channel], time: {period: ytd}}
  reference_sql: |
    SELECT COALESCE(o.channel, 'BRANCH'), count(DISTINCT a.account_no)
    FROM core.cust_account a
    LEFT JOIN obdx.origination_application o
      ON o.account_no = a.account_no AND o.status = 'APPROVED'
    WHERE a.auth_stat = 'A' AND a.account_open_date >= date_trunc('year', current_date)
      AND a.account_open_date < current_date + 1
    GROUP BY 1

