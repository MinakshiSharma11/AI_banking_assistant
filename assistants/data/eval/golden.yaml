- id: E14
  lang: en
  user: ho_analyst
  question: Average time spent in each loan stage last month
  route: metric
  check: rows
  tests: dwell time, ordered by stage_seq
  expect_query: {metric: stage_dwell_hours, dimensions: [stage],
                 filters: [{dimension: workflow, op: in, values: [LOAN_ORIG]}],
                 time: {period: last_month}}
  reference_sql: |
    SELECT h.stage_code,
           round(avg(extract(epoch FROM (h.exited_at - h.entered_at)) / 3600)::numeric, 1)
    FROM atum.wf_stage_history h JOIN atum.wf_instance i ON i.instance_id = h.instance_id
    WHERE i.wf_code = 'LOAN_ORIG'
      AND h.exited_at >= date_trunc('month', current_date) - interval '1 month'
      AND h.exited_at < date_trunc('month', current_date)
    GROUP BY 1

- id: E15
  lang: en
  user: ho_analyst
  question: Which stage breaches SLA most often?
  route: metric
  accept_routes: [clarify]
  check: first_key
  tests: ratio + ranking
  expect_query: {metric: sla_breach_rate, dimensions: [stage], time: {period: last_12_months},
                 order_by: {field: value, dir: desc}, limit: 1}
  reference_sql: &sla_top |
    SELECT h.stage_code,
           round((sum(CASE WHEN h.sla_breached THEN 1 ELSE 0 END)::numeric
                  / nullif(count(*), 0)), 4)
    FROM atum.wf_stage_history h
    JOIN atum.wf_instance i ON i.instance_id = h.instance_id
    JOIN atum.wf_stage st ON st.wf_code = i.wf_code AND st.stage_code = h.stage_code
    WHERE st.sla_hours IS NOT NULL
      AND h.exited_at >= date_trunc('month', current_date) - interval '11 months'
      AND h.exited_at < current_date + 1
    GROUP BY 1 ORDER BY 2 DESC LIMIT 1

