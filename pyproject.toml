[project]
name = "bank-conversational-ai"
version = "0.1.0"
description = "Bank Conversational AI platform: data, log, document and banking assistants on a shared core"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "faker>=30.0",
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "sqlglot>=30.32.0",
    "openai>=3.52.0",
    "anthropic>=2.9.0",
    "google-genai>=3.4.0",
    "cohere>=7.3.1",
    "fastapi>=0.163.1",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "pyjwt>=2.15.1",
    "openpyxl>=3.1.5",
    "reportlab>=5.1.0",
    "arabic-reshaper>=3.1.0",
    "python-bidi>=0.6.12",
    "markdown>=3.11.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "pytest-asyncio>=1.5.0",
    "types-openpyxl>=3.1.5.20261017",
    "types-markdown>=3.11.3.20261108",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S311", "S608"]  # random is fine for synthetic seed data; DDL/sanity SQL is static

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"mocks/seed/sanity.py" = ["E501"]  # long static SQL strings

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aiplatform", "assistants", "mocks", "tests"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live_llm'"
markers = [
    "db: needs the seeded Postgres from `make up && make seed`",
    "live_llm: calls the real local LLM (Ollama); slow, run with `make test-live`",
]
